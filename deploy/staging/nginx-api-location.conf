# Include inside the protected staging.securepay.ke TLS server block.
# Nginx first validates browser Basic Auth. The frontend forwards only its
# bearer token in X-SecurePay-Access-Token; this maps it to the API's standard
# Authorization header after the Basic Auth check.
location /api/ {
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_x_securepay_access_token;
    proxy_set_header X-SecurePay-Access-Token "";
    proxy_set_header Cookie "";
    proxy_read_timeout 60s;
}
