name: Master Phase 4 — Stores and Human Assistance

on:
  pull_request:
    branches:
      - integration/master-execution-20261019
    paths:
      - 'src/features/living-workspace/**'
      - 'tests/phase4-master-*'
      - '.github/workflows/master-phase4-stores-assistance.yml'
      - 'docs/MASTER_PHASE4_*'
  push:
    branches:
      - integration/master-execution-20261019

permissions:
  contents: read

concurrency:
  group: master-phase4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend regressions, Phase 4 contracts and build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Complete cumulative frontend regression suite
        run: npm run test:final-convergence
      - name: Stores, Plugs, Masters, Quick Assist and production write boundaries
        run: node --test tests/phase4-master-contract.test.mjs tests/phase3-master-tools.test.mjs tests/phase1-preview-production-write-guard.test.mjs tests/phase2-master-check.test.mjs
      - run: npm run typecheck
      - run: npm run lint -- --quiet
      - run: npm run build

  browser:
    name: Phase 1–4 journeys and before/after visual evidence
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: |
          npm ci
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run all local-only practical browser journeys
        run: |
          (npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/master-phase4-preview.log 2>&1) &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:4173/ >/dev/null
          node tests/phase1-public-browser.mjs
          node tests/phase2-master-browser.mjs
          node tests/phase3-master-browser.mjs
          node tests/phase4-master-browser.mjs
      - name: Save human visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-phase4-living-workspace-screenshots
          path: |
            artifacts/phase1/*.png
            artifacts/phase2-master/*.png
            artifacts/phase3-master/*.png
            artifacts/phase4-master/*.png
          if-no-files-found: warn
