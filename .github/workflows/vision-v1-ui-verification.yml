name: Vision V1 UI verification

on:
  push:
    branches:
      - feat/vision-v1-dream-foundation
  pull_request:
    paths:
      - 'src/features/visionboard/dreams/**'
      - 'src/api/securepay/visiondreams/**'
      - 'src/api/securepay/index.ts'
      - 'tests/vision-dreams.test.mjs'
      - '.github/workflows/vision-v1-ui-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vision-v1-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vision-ui:
    name: Vision UI tests, typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Vision Dream regressions (real execution)
        run: node --test tests/vision-dreams.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build only (no deploy)
        run: npm run build
