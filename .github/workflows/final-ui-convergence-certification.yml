name: Final UI Convergence Certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/final-ui-convergence-certification.yml"

permissions:
  contents: read

concurrency:
  group: final-ui-convergence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Full UI convergence certification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Full frontend regression
        run: npm run test:final-convergence
      - name: Typecheck
        run: npm run typecheck
      - name: Lint errors
        run: npm run lint -- --quiet
      - name: Production build
        run: npm run build
