name: SecurePay-owned ShortStays iframe focused readiness
on:
  push:
    branches: [feat/shortstays-securepay-owned-mini-frame-20261108]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frame-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Four exact-origin, guest-token and no-money tests
        run: node --test tests/shortstays-mini-frame.test.mjs
