<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin">
<title>SecurePay KS001 · My Ride staging</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font:13px/1.5 Arial,sans-serif;color:#17432d;background:#fff}
  #status{padding:16px;color:#665f42}
  #sdk-root{position:relative;width:100%;height:100dvh;overflow:hidden}
</style>
</head>
<body>
<div id="status" role="status">Checking authorised My Ride test installation…</div>
<div id="sdk-root" hidden></div>
<!-- The SecurePay-origin frame is the ONLY owner of conversation possession credentials. -->
<script src="/embed/securepay-guest-agent.js"></script>
<script src="/embed/securepay-embed.js"></script>
<script>
(function(){
  'use strict';
  /*
   * P0 FAIL-CLOSED: no My Ride exact staging preview origin has yet been
   * verified/approved. An operator MUST populate this list with specific
   * owner-approved preview origins, AND deploy a matching server-side
   * frame-ancestors CSP. Never derive approval from query strings, window
   * messages, parent-supplied text or broad domain suffixes.
   */
  var APPROVED_PARENTS=Object.freeze([]);
  var SITE_ID='myride-ke-preview';
  var PROTOCOL='myride.ks001.mini.v1';
  var status=document.getElementById('status');
  var parentOrigin='';
  try {parentOrigin=new URL(document.referrer).origin;} catch(_){}
  var requestedSite=new URLSearchParams(location.search).get('siteId');
  var inFrame=window.parent!==window;
  var currentHost=location.hostname.toLowerCase();
  var secureStaging=/^(?:staging|sandbox|qa|test)(?:[-.][a-z0-9-]+)*\.securepay\.ke$/.test(currentHost);
  if(!inFrame || !secureStaging ||
     !APPROVED_PARENTS.includes(parentOrigin) ||
     requestedSite!==SITE_ID){
    status.textContent='This My Ride KS001 frame is not approved for this website.';
    return;
  }
  var sdk=window.SecurePayEmbed;
  if(!sdk||!window.SecurePayGuestAgent){
    status.textContent='The SecurePay assistant is unavailable.';return;
  }
  // Registered guest installation MUST accept the exact Origin of this
  // SecurePay-hosted frame; parent approval is independently checked above.
  // Configure and separately certify this API origin before enabling the page.
  var apiBaseUrl='https://sandbox.securepay.ke';
  var root=document.getElementById('sdk-root');
  var assistant;
  var publicRef=null;
  try {
    assistant=sdk.mount({
      container:root,title:'My Ride',siteId:SITE_ID,apiBaseUrl:apiBaseUrl,
      embeddedFrame:true,tools:['ask','contract','securelink'],
      capabilityCatalogueEnabled:true,
      getReturnContext:function(){
        return {purpose:'UNSPECIFIED',returnReference:publicRef ? 'MR_'+publicRef : null};
      },
    });
    assistant.open();
  }catch(_){
    status.textContent='SecurePay could not safely open KS001.';return;
  }
  root.hidden=false;
  status.hidden=true;
  window.addEventListener('message',function(event){
    if(event.source!==window.parent || event.origin!==parentOrigin)return;
    var data=event.data;
    if(!data||typeof data!=='object'||data.siteId!==SITE_ID)return;
    if(data.type==='myride.ks001.hello.v1'){
      // Transport-only acknowledgement. Not proof of AI or booking readiness.
      window.parent.postMessage({type:'securepay.embed.myride.ready.v1',siteId:SITE_ID},parentOrigin);
      return;
    }
    if(data.type!=='myride.ks001.prefill.v1'||data.product!==PROTOCOL)return;
    if(typeof data.text!=='string'||!data.text.trim()||data.text.length>1200)return;
    var ref=data.publicReference;
    publicRef=typeof ref==='string' && /^[A-Za-z0-9_-]{3,61}$/.test(ref) ? ref : null;
    // This only prefills text. A real human must press Send in SecurePay.
    assistant.prefill(data.text);
  });
  window.parent.postMessage({type:'securepay.embed.myride.ready.v1',siteId:SITE_ID},parentOrigin);
})();
</script>
</body>
</html>
