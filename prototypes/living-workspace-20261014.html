<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SecurePay — Living Workspace concept</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#1b2b28;background:#f6f7f4}*{box-sizing:border-box}body{margin:0}button{cursor:pointer;font:inherit}header{background:#fff;border-bottom:1px solid #e1e7e1;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;font-size:20px;color:#214e42}.sub{color:#75837e;font-size:12px}.tabs{display:flex;gap:4px;background:#e9eee9;border-radius:13px;padding:4px}.tabs button{border:0;border-radius:9px;padding:10px 14px;background:transparent;color:#63726c}.tabs button.active{background:#fff;color:#143d33;box-shadow:0 1px 3px #0001;font-weight:700}.layout{display:grid;grid-template-columns:230px minmax(320px,1fr) 330px;gap:14px;padding:18px;max-width:1600px;margin:auto;min-height:calc(100vh - 74px)}.panel{background:white;border:1px solid #e0e7e0;border-radius:18px;min-width:0;display:flex;flex-direction:column;overflow:hidden}.pad{padding:18px}.eyebrow{text-transform:uppercase;letter-spacing:.1em;color:#7e8f88;font-weight:700;font-size:10px}.heading{font-weight:750;font-size:17px;margin:8px 0}.tool{padding:11px;border:0;border-radius:12px;background:transparent;text-align:left;width:100%;color:#354b42;margin:2px 0}.tool:hover,.tool.active{background:#e8f2ec}.tool.active{font-weight:750;color:#14533c}.tray{margin-top:14px;background:#f1f5f0;border-radius:14px;padding:14px;font-size:13px;line-height:1.55}.muted{color:#718079;font-size:13px;line-height:1.5}.chatlog{display:flex;flex-direction:column;gap:15px;padding:20px;overflow:auto;flex:1;min-height:360px}.bubble{border-radius:15px;background:#edf1ed;padding:14px;max-width:85%;font-size:14px;line-height:1.55}.bubble.ai{background:transparent;max-width:100%;padding:3px}.composer{padding:14px;border-top:1px solid #eef0ed;display:flex;gap:9px}.composer input{min-width:0;flex:1;border:1px solid #dae3dc;border-radius:12px;padding:12px;font:inherit}.primary{background:#245b48;color:white;border:0;border-radius:11px;padding:10px 13px}.small{font-size:12px}.fact{display:flex;gap:8px;align-items:start;padding:7px 0;font-size:13px}.tick{color:#247c56}.card{border:1px solid #e2e8e1;border-radius:14px;padding:13px;margin-top:12px}.help{padding:12px 0;border-bottom:1px solid #edf0ed;font-size:13px}.help:last-child{border:0}.chip{display:inline-block;background:#edf3ed;border-radius:40px;padding:5px 9px;font-size:11px;color:#466654}.banner{background:#f7f3e8;padding:13px;border-radius:11px;font-size:13px;line-height:1.5}.more{color:#275c48;font-weight:700;border:0;background:none;padding:8px 0;text-align:left}footer{border-top:1px solid #e5e9e4;padding:13px}.mobiletabs{display:none}.circle{display:none}.phase{margin-top:4px}.screenonly{display:inline}@media(max-width:1050px){.layout{grid-template-columns:175px minmax(290px,1fr) 270px;gap:8px;padding:8px}.pad{padding:13px}}@media(max-width:760px){header{padding:12px 14px}.layout{display:block;padding:9px}.panel{margin-bottom:9px}.tools{display:none}.result{display:none}.layout.mobile-work .chat{display:none}.layout.mobile-work .result{display:flex}.layout.mobile-tools .chat{display:none}.layout.mobile-tools .tools{display:flex}.mobiletabs{display:flex;justify-content:center;padding:9px;background:#fff;gap:5px}.mobiletabs button{border:0;border-radius:11px;padding:11px 14px;background:#edf1ed}.mobiletabs button.active{background:#245b48;color:white}.chatlog{min-height:52vh}.brand{font-size:18px}.desktoponly{display:none}} </style></head><body>
<header><div><div class="brand">SecurePay</div><div class="sub">Living workspace · Visual prototype</div></div><nav class="tabs" id="modes"><button class="active" data-mode="work">My Work</button><button data-mode="vision">Vision</button><button data-mode="circle">Circle</button><button data-mode="community">Community</button></nav></header>
<div class="mobiletabs"><button class="active" data-mobile="chat">Chat</button><button data-mobile="tools">Tools</button><button data-mobile="work">Your Work</button></div>
<main class="layout" id="layout">
<section class="panel tools"><div class="pad"><div class="eyebrow">Available capabilities</div><div class="heading">Your tools</div><div id="tools"></div><div class="tray" id="toolTray"></div></div></section>
<section class="panel chat"><div class="pad" style="border-bottom:1px solid #e9ede8"><div class="eyebrow" id="role">Agreement assistant</div><div class="heading">✦ KS001</div><div class="muted" id="intro">A clear agreement, one useful question at a time.</div></div><div class="chatlog" id="chatlog"></div><div class="composer"><input id="message" aria-label="Message KS001" placeholder="Ask, explain or change something…"><button class="primary" id="send">Send</button></div></section>
<section class="panel result"><div class="pad"><div class="eyebrow" id="resultType">Living Agreement</div><div class="heading" id="resultTitle">Workshop materials delivery</div><div class="chip" id="status">Draft · Building</div><div id="resultBody"></div><div class="card"><div class="eyebrow">SecurePay Helps</div><div id="help"></div></div></div><footer><span class="muted">Suggestions are not automatic commitments.</span></footer></section>
</main>
<script>
const states={work:{role:'Agreement assistant',intro:'A clear agreement, one useful question at a time.',title:'Workshop materials delivery',kind:'Living Agreement',status:'Draft · Building',prompt:'Where should the materials be delivered?',facts:['✓ Materials: 200 building blocks','✓ Date: 20 October','○ Delivery site not yet chosen'],helps:['Stores — explore suitable suppliers','Plug — help coordinate delivery','Community Saver — possible shared logistics, requires Plug coordination']},vision:{role:'Exploration companion',intro:'Imagine freely. We can explore without rushing to an Agreement.',title:'My workshop dream',kind:'Living Vision',status:'Exploring · Not an Agreement',prompt:'What do you most want this workshop to make possible?',facts:['✧ Idea: A workshop for makers','✧ Explore: Equipment and layout','✧ Compare: Cement and construction suppliers'],helps:['Masters — learn from experienced makers','Stores — explore equipment and materials','Skills Institute — discover practical guides']},circle:{role:'Circle collaboration',intro:'Ideas belong to their authors; decisions require the Circle’s governance.',title:'Our shared workshop',kind:'Shared Circle Vision',status:'Proposals · No decision yet',prompt:'What possibilities should the group explore together?',facts:['✧ Shared aim: A workshop','○ Proposed site: under discussion','○ Equipment: suggestions open'],helps:['Members and stewards','Projects and apprenticeships','Stores and relevant Masters']},community:{role:'Community guide',intro:'Discover people, meaningful projects and life in the Trust Project.',title:'The Trust Project',kind:'Community',status:'LIVE · Circles · Projects',prompt:'Would you like to meet people, find a project or contribute a skill?',facts:['○ LIVE conversations','○ Circles and events','○ Projects seeking skills','○ Knowledge and recorded impact'],helps:['Find a Circle to join','Find opportunities to contribute','See member work and outcomes']}};
const toolNames=['Places','Documents','Photos','Stores','Money','Financial Institutions','People','Milestones','Creative tools','Circles','Skills Institute'];let mode='work',tool='Places',place='',limit=false;const $=id=>document.getElementById(id);
function render(){const s=states[mode];$('role').textContent=s.role;$('intro').textContent=s.intro;$('resultType').textContent=s.kind;$('resultTitle').textContent=s.title;$('status').textContent=s.status;$('tools').innerHTML=toolNames.map(t=>'<button class="tool '+(t===tool?'active':'')+'" data-tool="'+t+'">'+({Places:'⌖',Documents:'▤',Photos:'▣',Stores:'▥',Money:'◉','Financial Institutions':'▦',People:'♧',Milestones:'☷','Creative tools':'✎',Circles:'◎','Skills Institute':'◇'}[t]||'•')+' &nbsp;'+t+'</button>').join('');$('tools').querySelectorAll('button').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;render();});let content='<b>'+tool+'</b><p class="muted">';if(tool==='Places')content+='Select a saved site to bring its location into the current draft.</p><button class="primary small" id="choosePlace">Use Workshop site</button>';else if(tool==='Documents')content+='Add a quotation or plan. Statuses remain separate: saved, understood, proposed, confirmed.</p><button class="primary small" id="addDoc">Simulate document received</button>';else if(tool==='Photos')content+='Attach site photos and caption them in chat. Check visibility before sharing.</p><button class="primary small" id="addPhoto">Simulate captioned photo</button>';else if(tool==='Milestones')content+='Split an Agreement into delivery, installation and handover proposals.</p><button class="primary small" id="addStage">Propose milestones</button>';else content+='Explore this capability. External or paid actions must ask before receiving data or charging.</p>';$('toolTray').innerHTML=content;['choosePlace','addDoc','addPhoto','addStage'].forEach(id=>{const b=$(id);if(b)b.onclick=()=>{place=({'choosePlace':'Workshop site, Nairobi','addDoc':'Quotation uploaded (awaiting confirmation)','addPhoto':'Site photograph captioned','addStage':'Delivery + installation milestones proposed'})[id];append('You used '+tool+': '+place,1);append('I can see that. The living summary now reflects it. What would you like to confirm next?',0);render();};});$('resultBody').innerHTML=s.facts.concat(place?['✓ '+place]:[]).map(f=>'<div class="fact"><span class="tick">'+f[0]+'</span><span>'+f.slice(1)+'</span></div>').join('')+(mode==='vision'?'<div class="card"><b>Exploration allowance</b><p class="muted">Vision stays readable during cooldown. My Work is always available.</p><button class="more" id="limit"> '+(limit?'Resume free exploration preview':'Preview cooldown')+'</button>'+(limit?'<div class="banner">Free exploration has paused. Return after refresh or choose paid continuation. Saved Vision and My Work remain available.</div>':'')+'</div>':'');if($('limit'))$('limit').onclick=()=>{limit=!limit;render()};$('help').innerHTML=s.helps.map(h=>'<div class="help">'+h+'</div>').join('');document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));}
function append(txt,user){const el=document.createElement('div');el.className='bubble '+(user?'':'ai');el.textContent=(user?'You: ':'KS001: ')+txt;$('chatlog').appendChild(el);$('chatlog').scrollTop=$('chatlog').scrollHeight;}
function start(m){mode=m;place='';limit=false;$('chatlog').replaceChildren();append(states[m].prompt,0);render();}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>start(b.dataset.mode));document.querySelectorAll('[data-mobile]').forEach(b=>b.onclick=()=>{const v=b.dataset.mobile;$('layout').className='layout'+(v==='work'?' mobile-work':v==='tools'?' mobile-tools':'');document.querySelectorAll('[data-mobile]').forEach(x=>x.classList.toggle('active',x===b));});function send(){const v=$('message').value.trim();if(!v)return;append(v,1);$('message').value='';append(mode==='work'?'Thanks. I will keep the next step clear, and show proposed changes before they become Agreement terms.':mode==='vision'?'Interesting. We can explore alternatives and keep only the ideas you choose.':mode==='circle'?'That is a useful proposal. Shall we make it visible to the Circle for discussion?':'We can look for relevant community activities and people.',0);} $('send').onclick=send;$('message').onkeydown=e=>{if(e.key==='Enter')send()};start('work');
</script></body></html>
